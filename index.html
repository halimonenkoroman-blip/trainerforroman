<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Тренировка</h1>
    <div id="headerActions"></div>
  </header>

  <main id="view"></main>

  <div id="restBar" class="rest-bar">
    <span>⏱ Отдых: <b id="restTime">0:00</b></span>
    <button class="btn-mini" onclick="stopRest()">Пропустить</button>
  </div>

  <nav class="tabbar">
    <button class="tab" data-tab="workout"><span>💪</span><small>Трен</small></button>
    <button class="tab" data-tab="schedule"><span>📅</span><small>План</small></button>
    <button class="tab" data-tab="history"><span>📊</span><small>История</small></button>
    <button class="tab" data-tab="settings"><span>⚙️</span><small>Настр</small></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
